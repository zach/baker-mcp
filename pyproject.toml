[project]
name = "baker-mcp"
version = "0.1.0"
description = "An MCP server that gives an agent client a Baker game's tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
baker-mcp = "baker_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baker_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
